# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  jobs:
    post_checkout:
      # setuptools_scm needs the tags to version the docs; Read the Docs checks
      # out a tagged version without them and the docs would show a dev version
      - git fetch --unshallow || true
      - git fetch --tags
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
