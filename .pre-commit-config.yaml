repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
  - repo: local
    hooks:
      # Pinned: the pre-commit mirror only offers 4.0 alphas after 3.1.0, and
      # 4.0.0-alpha.8 hangs. Needs node on PATH.
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: ["prettier@3.9.10"]
        files: \.(md|yml)$
